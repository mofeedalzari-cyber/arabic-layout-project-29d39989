name: Monitor Render service

on:
  schedule:
    # Every 15 minutes is enough on a paid Render plan (no free-tier sleep).
    # It also logs health metrics so crashes can be diagnosed from GitHub logs.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-render-service
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify service health and app response
        run: |
          set -euo pipefail

          echo "=== Health check ==="
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 60 \
            "https://arabic-layout-project.onrender.com/api/public/health"
          echo

          echo "=== Home page check ==="
          curl --fail --silent --show-error --location \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 60 \
            --output /dev/null \
            -w "HTTP %{http_code} | time_total=%{time_total}\n" \
            "https://arabic-layout-project.onrender.com/"
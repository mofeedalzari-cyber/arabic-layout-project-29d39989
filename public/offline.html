<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>كرتي — لا يوجد اتصال</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #009688; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid; place-items: center; padding: 24px; text-align: center;
      }
      .card { background: rgba(255,255,255,.12); border-radius: 18px; padding: 28px 22px; max-width: 420px; width: 100%; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; font-size: .95rem; opacity: .92; line-height: 1.7; }
      button {
        font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: .7rem 1.4rem;
        background: #fff; color: #00695c; cursor: pointer;
      }
      small { display: block; margin-top: 1rem; font-size: .75rem; opacity: .8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>سيتم فتح التطبيق تلقائياً بمجرد عودة الاتصال. تأكد من تشغيل بيانات الجوال أو الواي فاي.</p>
      <button onclick="retry()">إعادة المحاولة</button>
      <small>جميع الحقوق محفوظة © 2026<br />برمجة وتصميم مفيد الزري</small>
    </div>
    <script>
      function retry() { location.reload(); }
      window.addEventListener("online", retry);
      setInterval(function () { if (navigator.onLine) retry(); }, 5000);
    </script>
  </body>
</html>

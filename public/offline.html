<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>كرتي — تعذر الاتصال</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #009688; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid; place-items: center; padding: 24px; text-align: center;
      }
      .card { background: rgba(255,255,255,.12); border-radius: 18px; padding: 28px 22px; max-width: 420px; width: 100%; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; font-size: .95rem; opacity: .92; line-height: 1.7; }
      .btns { display: grid; gap: .6rem; }
      button {
        font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: .7rem 1.4rem;
        background: #fff; color: #00695c; cursor: pointer;
      }
      button.ghost { background: rgba(255,255,255,.18); color: #fff; }
      small { display: block; margin-top: 1rem; font-size: .75rem; opacity: .8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">تعذر الوصول إلى الخادم</h1>
      <p id="msg">
        يبدو أنك متصل بشبكة واي فاي تتطلب تسجيل الدخول (هوت سبوت الميكروتك).
        سجّل الدخول في صفحة الهوت سبوت أولاً ثم أعد المحاولة.
      </p>
      <div class="btns">
        <button onclick="openPortal()">فتح صفحة تسجيل دخول الهوت سبوت</button>
        <button class="ghost" onclick="retry()">إعادة المحاولة</button>
      </div>
      <small>جميع الحقوق محفوظة © 2026<br />برمجة وتصميم مفيد الزري</small>
    </div>
    <script>
      var HOME = "/";
      function retry() { location.replace(HOME); }
      function openPortal() {
        // بوابة الهوت سبوت الافتراضية للميكروتك
        var url = "http://192.168.88.1/login";
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
            window.Capacitor.Plugins.Browser.open({ url: url });
            return;
          }
        } catch (e) {}
        window.open(url, "_blank");
      }
      function updateText() {
        var offline = !navigator.onLine;
        document.getElementById("title").textContent = offline
          ? "لا يوجد اتصال بالإنترنت"
          : "تعذر الوصول إلى الخادم";
        document.getElementById("msg").textContent = offline
          ? "تأكد من تشغيل بيانات الجوال أو الواي فاي. سيتم فتح التطبيق تلقائياً عند عودة الاتصال."
          : "يبدو أنك متصل بشبكة واي فاي تتطلب تسجيل الدخول (هوت سبوت الميكروتك). سجّل الدخول في صفحة الهوت سبوت أولاً ثم أعد المحاولة.";
      }
      // فحص فعلي للوصول للخادم بدل الاعتماد على navigator.onLine فقط
      async function probe() {
        updateText();
        if (!navigator.onLine) return;
        try {
          var res = await fetch(HOME + "?probe=" + Date.now(), { cache: "no-store" });
          if (res && res.ok) retry();
        } catch (e) {}
      }
      window.addEventListener("online", probe);
      setInterval(probe, 5000);
      probe();
    </script>
  </body>
</html>
